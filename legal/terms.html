  <head>

  <body>
    <main class="app-shell">
      <section class="report-section">
        <span class="eyebrow">合规文件</span>
        <h1>避坑宝用户协议</h1>
        <p>更新日期：请填写正式发布日期</p>
        <h2>一、服务内容</h2>
        <p>避坑宝提供装修报价单、合同、聊天记录等资料的消费风险辅助分析，并生成风险提示、追问清单、沟通话术和摘要。</p>
        <h2>二、用户责任</h2>
        <p>用户应确保上传资料来源合法，并对资料真实性、完整性和授权情况负责。</p>
        <h2>三、付费服务</h2>
        <p>完整报告、合同复查、人工复核等可能为付费服务。具体价格、服务内容、退款规则以支付页展示为准。</p>
        <h2>四、服务限制</h2>
        <p>避坑宝不推荐装修公司，不承接施工监理，不保证一定节省费用，不对商家履约结果作承诺。</p>
        <h2>五、争议处理</h2>
        <p>用户如对报告、支付或资料处理有疑问，可通过正式客服入口联系我们。</p>
      </section>
    </main>
